name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '留空为普通测试构建；填写 v0.7.0 这类版本号会创建签名更新和 Draft Release'
        required: false
        type: string
  push:
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  RELEASE_MODE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify release version
        if: env.RELEASE_MODE == 'true'
        run: node -e "const v=require('./package.json').version;if(process.env.RELEASE_TAG!=='v'+v)throw new Error('发布版本必须是 v'+v)"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows packages with updater artifacts
        if: env.RELEASE_MODE == 'true'
        run: pnpm tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build Windows packages
        if: env.RELEASE_MODE != 'true'
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: OJ-Insight-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  build-macos:
    name: MacOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify release version
        if: env.RELEASE_MODE == 'true'
        run: node -e "const v=require('./package.json').version;if(process.env.RELEASE_TAG!=='v'+v)throw new Error('发布版本必须是 v'+v)"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build MacOS packages with updater artifacts
        if: env.RELEASE_MODE == 'true'
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg
        env:
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build MacOS packages
        if: env.RELEASE_MODE != 'true'
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.ci.conf.json
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: Verify MacOS app signature
        run: codesign --verify --deep --strict "src-tauri/target/universal-apple-darwin/release/bundle/macos/OJ Insight.app"
      - name: Upload MacOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: OJ-Insight-MacOS
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.sig
          if-no-files-found: error

  build-linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify release version
        if: env.RELEASE_MODE == 'true'
        run: node -e "const v=require('./package.json').version;if(process.env.RELEASE_TAG!=='v'+v)throw new Error('发布版本必须是 v'+v)"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Linux packages with updater artifacts
        if: env.RELEASE_MODE == 'true'
        run: pnpm tauri build --bundles appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build Linux packages
        if: env.RELEASE_MODE != 'true'
        run: pnpm tauri build --bundles appimage --config src-tauri/tauri.ci.conf.json
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: OJ-Insight-Linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
          if-no-files-found: error

  package-release:
    name: Package all platforms
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
      - build-linux
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: OJ-Insight-*
          path: release

      - name: Create release archive
        id: package
        run: |
          mkdir package
          find release -type f \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.AppImage' \) -exec cp {} package/ \;
          test "$(find package -maxdepth 1 -type f | wc -l)" -eq 3
          zip -j OJ-Insight-All-Platforms.zip package/*
          unzip -l OJ-Insight-All-Platforms.zip

      - name: Upload all-platform release bundle
        uses: actions/upload-artifact@v4
        with:
          name: OJ-Insight-All-Platforms
          path: OJ-Insight-All-Platforms.zip
          if-no-files-found: error

  publish-release:
    name: Prepare signed draft release
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
      - build-linux
      - package-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Verify release version
        if: env.RELEASE_MODE == 'true'
        run: node -e "const v=require('./package.json').version;if(process.env.RELEASE_TAG!=='v'+v)throw new Error('发布版本必须是 v'+v)"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: OJ-Insight-*
          path: release
      - name: Generate updater manifest
        run: node scripts/generate-latest-json.mjs --version "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --directory release --output release/latest.json
      - name: Prepare release files
        run: |
          mkdir publish
          find release -type f \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.AppImage' -o -iname '*.sig' -o -iname '*.app.tar.gz' -o -iname 'OJ-Insight-All-Platforms.zip' \) -exec cp {} publish/ \;
          cp release/latest.json publish/latest.json
      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .draft)" = "true"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "OJ Insight $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" publish/* --clobber
