name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm install
      - name: Build Windows packages
        run: npm run tauri build
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: OJ-Insight-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    name: MacOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm install
      - name: Build MacOS packages
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          # Keep unsigned community builds internally consistent. Gatekeeper may
          # still require the documented xattr step until Developer ID signing
          # and notarization credentials are configured.
          APPLE_SIGNING_IDENTITY: '-'
      - name: Verify MacOS app signature
        run: codesign --verify --deep --strict "src-tauri/target/universal-apple-darwin/release/bundle/macos/OJ Insight.app"
      - name: Upload MacOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: OJ-Insight-MacOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - name: Install frontend dependencies
        run: npm install
      - name: Build Linux packages
        run: npm run tauri build
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: OJ-Insight-Linux
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  package-release:
    name: Package all platforms
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
      - build-linux
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: OJ-Insight-*
          path: release

      - name: Create release archive
        id: package
        run: |
          mkdir package
          find release -type f \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.AppImage' \) -exec cp {} package/ \;
          test "$(find package -maxdepth 1 -type f | wc -l)" -eq 3
          zip -j OJ-Insight-All-Platforms.zip package/*
          unzip -l OJ-Insight-All-Platforms.zip

      - name: Upload all-platform release bundle
        uses: actions/upload-artifact@v4
        with:
          name: OJ-Insight-All-Platforms
          path: OJ-Insight-All-Platforms.zip
          if-no-files-found: error
