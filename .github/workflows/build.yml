name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm install
      - name: Build Windows packages
        run: npm run tauri build
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: OJ-Insight-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm install
      - name: Build macOS packages
        run: npm run tauri build
      - name: Zip app bundle
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent "OJ Insight.app" "OJ Insight.app.zip"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: OJ-Insight-macOS
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.zip
          if-no-files-found: error

  build-linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - name: Install frontend dependencies
        run: npm install
      - name: Build Linux packages
        run: npm run tauri build
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: OJ-Insight-Linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  package-release:
    name: Package all platforms
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
      - build-linux
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: OJ-Insight-*
          path: release

      - name: Create checksums and release archive
        run: |
          cd release
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          zip -r ../OJ-Insight-All-Platforms.zip .

      - name: Upload all-platform release bundle
        uses: actions/upload-artifact@v4
        with:
          name: OJ-Insight-All-Platforms
          path: OJ-Insight-All-Platforms.zip
          if-no-files-found: error
