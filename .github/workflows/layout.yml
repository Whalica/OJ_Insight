name: Responsive layout

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layout-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Chromium layout tests
        run: pnpm exec playwright test --config config/playwright.config.ts --project=chromium
      - name: WebKit layout tests
        run: pnpm exec playwright test --config config/playwright.config.ts tests/layout/relationships.spec.ts tests/layout/responsive.spec.ts --project=webkit
      - name: WebKit XCPC tests
        run: pnpm exec playwright test --config config/playwright.config.ts tests/layout/xcpc-tags.spec.ts --project=webkit --retries=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: layout-test-results
          path: test-results/
